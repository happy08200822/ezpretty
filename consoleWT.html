<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>預約系統 - 管理後台</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .slot-btn { transition: all 0.15s ease-in-out; }
    .slot-open { background-color: #ecfdf5; border-color: #6ee7b7; color: #065f46; } 
    .slot-closed { background-color: #fef2f2; border-color: #fca5a5; color: #991b1b; } 
    .slot-event { background-color: #eff6ff; border-color: #bfdbfe; color: #1e3a8a; cursor: not-allowed; } 
    @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .service-card { animation: slideIn 0.2s ease-out forwards; }
    
    /* 登入畫面 */
    #login-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background: #f8fafc; z-index: 100;
      display: flex; justify-content: center; align-items: center;
    }
    
    .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #fff; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 p-0 md:p-8 relative min-h-screen">

  <!-- 🔒 登入畫面 -->
  <div id="login-screen">
    <div class="bg-white p-8 md:p-10 rounded-2xl shadow-xl border border-slate-100 max-w-sm w-full mx-4 text-center">
      <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
      </div>
      <h2 class="text-2xl font-extrabold text-slate-800 mb-2">後台管理系統</h2>
      <p class="text-slate-500 text-sm mb-6">請輸入管理員密碼以進入</p>
      
      <input type="password" id="admin-password" placeholder="請輸入密碼" class="w-full text-center tracking-widest text-lg rounded-lg border-slate-300 shadow-sm border p-3 focus:border-indigo-500 outline-none mb-4" onkeypress="handleEnter(event)">
      <p id="login-error" class="text-red-500 text-sm mb-4 hidden font-semibold">密碼錯誤，請重新輸入</p>
      
      <button id="btn-login" onclick="attemptLogin()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 shadow-md transition-colors flex justify-center items-center gap-2">
        <span>登入</span>
      </button>
    </div>
  </div>

  <!-- 🖥️ 後台主畫面 (預設隱藏) -->
  <div class="max-w-5xl mx-auto hidden p-4" id="main-content">
    
    <div class="flex justify-between items-center mb-8">
      <div>
        <h1 class="text-3xl font-extrabold text-indigo-700">店家管理後台</h1>
        <p class="text-slate-500 mt-1">輕鬆管理營業設定、服務項目與排班</p>
      </div>
      <div class="px-4 py-2 bg-indigo-100 text-indigo-800 rounded-full text-sm font-bold shadow-sm flex items-center gap-2 cursor-pointer hover:bg-indigo-200" onclick="location.reload()" title="登出">
        <span>🔒</span> 暐庭 (WT)
      </div>
    </div>

    <!-- 區塊 1：品牌與門面設定 -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-6">
      <h2 class="text-xl font-bold mb-5 flex items-center gap-2 text-slate-800"><span>🏪</span> 品牌與門面設定</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">小標籤 (tag)</label>
          <input type="text" id="conf-tag" class="w-full rounded-lg border-slate-300 shadow-sm border p-2.5 outline-none">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">主標題 (title)</label>
          <input type="text" id="conf-title" class="w-full rounded-lg border-slate-300 shadow-sm border p-2.5 outline-none">
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-semibold text-slate-700 mb-1">副標題/描述 (desc)</label>
          <input type="text" id="conf-desc" class="w-full rounded-lg border-slate-300 shadow-sm border p-2.5 outline-none">
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-semibold text-slate-700 mb-1">LINE 官方帳號連結 (line_url)</label>
          <input type="url" id="conf-line" class="w-full rounded-lg border-slate-300 shadow-sm border p-2.5 outline-none text-indigo-600">
        </div>
      </div>
    </div>

    <!-- 區塊 2：營業規則設定 -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-6">
      <h2 class="text-xl font-bold mb-5 flex items-center gap-2 text-slate-800"><span>⏱️</span> 營業規則設定</h2>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">開門時間</label>
          <input type="time" id="conf-open" class="w-full rounded-lg border-slate-300 shadow-sm border p-2.5 outline-none">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">打烊時間</label>
          <input type="time" id="conf-close" class="w-full rounded-lg border-slate-300 shadow-sm border p-2.5 outline-none">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">時段間隔</label>
          <select id="conf-interval" class="w-full rounded-lg border-slate-300 shadow-sm border p-2.5 outline-none bg-white">
            <option value="30">每 30 分鐘</option>
            <option value="60">每 60 分鐘</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">開放天數</label>
          <input type="number" id="conf-advance" class="w-full rounded-lg border-slate-300 shadow-sm border p-2.5 outline-none">
        </div>
      </div>
      
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-3">固定公休日 <span class="text-xs font-normal text-slate-400 ml-2">打勾的日子系統會自動排休</span></label>
        <div class="flex flex-wrap gap-4" id="weekdays-container">
          <label class="flex items-center gap-2 cursor-pointer bg-slate-50 border border-slate-200 px-4 py-2 rounded-lg hover:bg-slate-100"><input type="checkbox" value="1" class="w-4 h-4 text-indigo-600"> <span class="font-medium">週一</span></label>
          <label class="flex items-center gap-2 cursor-pointer bg-slate-50 border border-slate-200 px-4 py-2 rounded-lg hover:bg-slate-100"><input type="checkbox" value="2" class="w-4 h-4 text-indigo-600"> <span class="font-medium">週二</span></label>
          <label class="flex items-center gap-2 cursor-pointer bg-slate-50 border border-slate-200 px-4 py-2 rounded-lg hover:bg-slate-100"><input type="checkbox" value="3" class="w-4 h-4 text-indigo-600"> <span class="font-medium">週三</span></label>
          <label class="flex items-center gap-2 cursor-pointer bg-slate-50 border border-slate-200 px-4 py-2 rounded-lg hover:bg-slate-100"><input type="checkbox" value="4" class="w-4 h-4 text-indigo-600"> <span class="font-medium">週四</span></label>
          <label class="flex items-center gap-2 cursor-pointer bg-slate-50 border border-slate-200 px-4 py-2 rounded-lg hover:bg-slate-100"><input type="checkbox" value="5" class="w-4 h-4 text-indigo-600"> <span class="font-medium">週五</span></label>
          <label class="flex items-center gap-2 cursor-pointer bg-slate-50 border border-slate-200 px-4 py-2 rounded-lg hover:bg-slate-100"><input type="checkbox" value="6" class="w-4 h-4 text-indigo-600"> <span class="font-medium">週六</span></label>
          <label class="flex items-center gap-2 cursor-pointer bg-red-50 border border-red-200 px-4 py-2 rounded-lg hover:bg-red-100"><input type="checkbox" value="0" class="w-4 h-4 text-red-600"> <span class="font-medium text-red-700">週日</span></label>
        </div>
      </div>
    </div>

    <!-- 區塊 3：動態服務項目管理 -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-8">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-5 gap-4">
        <h2 class="text-xl font-bold flex items-center gap-2 text-slate-800"><span>💅</span> 服務項目清單</h2>
        <button onclick="addServiceCard()" class="bg-indigo-50 text-indigo-700 font-bold px-4 py-2 rounded-lg hover:bg-indigo-100 flex items-center gap-1 border border-indigo-200 transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd" /></svg>新增項目
        </button>
      </div>
      <div id="services-container" class="space-y-4"></div>
      <div class="mt-8 flex justify-end pt-5 border-t border-slate-100">
        <button id="save-settings-btn" onclick="saveAllSettings()" class="bg-indigo-600 text-white font-bold px-8 py-3 rounded-xl hover:bg-indigo-700 shadow-lg flex items-center gap-2">
          <span>💾</span> 儲存設定與服務清單
        </button>
      </div>
    </div>

    <!-- 區塊 4：排班管理看板 -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-8">
      <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4 border-b border-slate-100 pb-4">
        <h2 class="text-xl font-bold flex items-center gap-2"><span>📅</span> 排班與店休管理</h2>
        
        <div class="flex bg-slate-100 rounded-lg p-1">
          <button id="btn-prev-week" onclick="changeWeek(-1)" class="px-4 py-1.5 text-sm font-semibold text-slate-600 hover:text-indigo-600 rounded-md disabled:opacity-30">◀ 上一週</button>
          <button id="btn-next-week" onclick="changeWeek(1)" class="px-4 py-1.5 text-sm font-semibold text-slate-600 hover:text-indigo-600 rounded-md bg-white shadow-sm disabled:opacity-30">下一週 ▶</button>
        </div>
      </div>

      <div class="flex gap-4 mb-4 text-sm font-medium text-slate-600">
        <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-emerald-400"></span> 開放預約 (點擊可排休)</div>
        <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-red-400"></span> 鎖定休假 (點擊可開放)</div>
        <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-blue-300"></span> 日曆行程 (無法點擊)</div>
      </div>

      <!-- 真實日曆網格 -->
      <div class="overflow-x-auto">
        <div class="min-w-[700px]" id="schedule-grid-container"></div>
      </div>

      <div class="mt-8 flex justify-end">
        <button id="save-schedule-btn" onclick="saveSchedule()" class="bg-emerald-500 text-white font-bold px-8 py-3 rounded-xl hover:bg-emerald-600 shadow-lg text-lg flex items-center gap-2">
          <span>💾</span> 儲存最新排班
        </button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // ⚠️ 貼上你最新的 GAS 網址
    // ==========================================
    const API_URL = "https://script.google.com/macros/s/AKfycbwUs-vR35AnP5iHJx-Eiwf-b8qnkOTdvzrd4pN0SdFnJcIDS0X6LboqdMd9I1-n--4G/exec"; 

    // 全局變數
    let validPassword = ""; // 成功登入後，把密碼存在這裡，發送 API 都要帶著
    let adminGridData = []; 
    let weekCols = []; 
    let currentWkIndex = 0;

    // ----------------------------------------------------
    // 登入驗證
    // ----------------------------------------------------
    function handleEnter(e) {
      if(e.key === 'Enter') attemptLogin();
    }

    function attemptLogin() {
      const pwdInput = document.getElementById('admin-password');
      const errorText = document.getElementById('login-error');
      const btn = document.getElementById('btn-login');
      
      const pwd = pwdInput.value.trim();
      if(!pwd) return;

      errorText.classList.add('hidden');
      btn.innerHTML = `<span class="spinner"></span> 驗證中...`;
      btn.disabled = true;

      fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: "admin_login", password: pwd })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === 'success') {
          // 密碼正確！解鎖畫面，並把 GAS 順便傳回來的資料填進去
          validPassword = pwd; // 記住這把鑰匙
          document.getElementById('login-screen').style.display = 'none';
          document.getElementById('main-content').classList.remove('hidden');
          
          fillConfigData(data.data.config);
          buildScheduleGrid(data.data.raw_grid);
        } else {
          // 密碼錯誤
          errorText.classList.remove('hidden');
          pwdInput.value = "";
          pwdInput.focus();
        }
      })
      .catch(err => {
        alert("網路連線錯誤，請重試！");
      })
      .finally(() => {
        btn.innerHTML = `<span>登入</span>`;
        btn.disabled = false;
      });
    }

    // ----------------------------------------------------
    // 介面資料填寫與排班網格繪製 (同上一版)
    // ----------------------------------------------------
    function fillConfigData(config) {
      document.getElementById('conf-tag').value = config.tag || '';
      document.getElementById('conf-title').value = config.title || '';
      document.getElementById('conf-desc').value = config.desc || '';
      document.getElementById('conf-line').value = config.line_url || '';
      document.getElementById('conf-open').value = config.open_time || '10:00';
      document.getElementById('conf-close').value = config.close_time || '20:00';
      document.getElementById('conf-interval').value = config.interval || '60';
      document.getElementById('conf-advance').value = config.advance_days || '14';
      
      if (config.closed_weekdays) {
        const days = config.closed_weekdays.split(',').map(s => s.trim());
        const checkboxes = document.querySelectorAll('#weekdays-container input[type="checkbox"]');
        checkboxes.forEach(cb => cb.checked = days.includes(cb.value));
      }

      const container = document.getElementById('services-container');
      container.innerHTML = '';
      if (config.services && config.services.length > 0) {
        config.services.forEach(s => addServiceCard(s.category, s.name, s.duration, s.price));
      } else {
        addServiceCard("", "", "", ""); 
      }
    }

    function addServiceCard(cat = "", name = "", dur = "", price = "") {
      const container = document.getElementById('services-container');
      const cardHTML = `
        <div class="service-card flex flex-col md:flex-row gap-4 p-4 border border-slate-200 rounded-xl bg-slate-50 relative group">
          <div class="w-full md:w-1/4">
            <label class="block text-xs font-semibold text-slate-500 mb-1">大分類 (選填)</label>
            <input type="text" class="w-full rounded-md border-slate-300 border p-2 outline-none" value="${cat}" placeholder="例: 染髮">
          </div>
          <div class="w-full md:w-2/4">
            <label class="block text-xs font-semibold text-slate-500 mb-1">服務名稱</label>
            <input type="text" class="w-full rounded-md border-slate-300 border p-2 outline-none font-bold" value="${name}" placeholder="服務名稱">
          </div>
          <div class="w-full md:w-1/4 flex gap-2">
            <div class="w-1/2">
              <label class="block text-xs font-semibold text-slate-500 mb-1">時間</label>
              <input type="text" class="w-full rounded-md border-slate-300 border p-2 outline-none" value="${dur}" placeholder="30 min">
            </div>
            <div class="w-1/2">
              <label class="block text-xs font-semibold text-slate-500 mb-1">價格</label>
              <input type="text" class="w-full rounded-md border-slate-300 border p-2 outline-none text-indigo-600 font-bold" value="${price}" placeholder="$500">
            </div>
          </div>
          <button onclick="removeCard(this)" class="absolute -right-2 -top-2 bg-red-100 text-red-600 p-1.5 rounded-full hover:bg-red-500 hover:text-white transition md:opacity-0 md:group-hover:opacity-100 border border-red-200 shadow-sm" title="刪除">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
          </button>
        </div>
      `;
      container.insertAdjacentHTML('beforeend', cardHTML);
    }
    function removeCard(btn) {
      const card = btn.closest('.service-card');
      card.style.opacity = '0'; card.style.transform = 'translateY(-10px)'; card.style.transition = 'all 0.2s ease-out';
      setTimeout(() => card.remove(), 200);
    }

    function buildScheduleGrid(gridData) {
      adminGridData = gridData;
      weekCols = [];
      let currentChunk = [];
      
      for (let c = 1; c < gridData[0].length; c++) {
        currentChunk.push(c);
        let headerStr = String(gridData[0][c]);
        if (headerStr.includes("週日") || c === gridData[0].length - 1) {
          weekCols.push(currentChunk);
          currentChunk = [];
        }
      }
      currentWkIndex = 0;
      renderScheduleView();
    }

    function renderScheduleView() {
      const container = document.getElementById('schedule-grid-container');
      container.innerHTML = '';
      const colsToRender = weekCols[currentWkIndex] || [];
      const numCols = colsToRender.length + 1;
      
      document.getElementById('btn-prev-week').disabled = (currentWkIndex === 0);
      document.getElementById('btn-next-week').disabled = (currentWkIndex >= weekCols.length - 1);

      let headerHTML = `<div class="grid gap-2 mb-3" style="grid-template-columns: repeat(${numCols}, minmax(0, 1fr));">`;
      headerHTML += `<div class="text-center font-bold text-slate-400 text-sm py-2">時段</div>`;
      colsToRender.forEach(c => {
        let text = adminGridData[0][c]; 
        let parts = text.split(" ");
        let datePart = parts[0].substring(5).replace('-', '/'); 
        let weekPart = parts[1] ? parts[1].replace(/[()]/g, '') : ""; 
        let colorClass = text.includes("週日") ? "text-red-500" : (text.includes("週六") ? "text-indigo-600" : "text-slate-800");
        headerHTML += `<div class="text-center bg-slate-50 rounded-lg py-2 border border-slate-200"><div class="text-xs text-slate-500">${weekPart}</div><div class="font-bold ${colorClass}">${datePart}</div></div>`;
      });
      headerHTML += `</div>`;
      container.insertAdjacentHTML('beforeend', headerHTML);

      for (let r = 1; r < adminGridData.length; r++) {
        let rowTitle = adminGridData[r][0];
        let borderClass = (r === 1) ? "mb-4 pb-4 border-b border-slate-200" : "mb-2";
        let rowHTML = `<div class="grid gap-2 ${borderClass}" style="grid-template-columns: repeat(${numCols}, minmax(0, 1fr));">`;
        rowHTML += `<div class="flex items-center justify-center font-bold text-sm text-slate-500">${rowTitle}</div>`;
        
        colsToRender.forEach(c => {
          let cellVal = adminGridData[r][c];
          if (cellVal === true) {
            rowHTML += `<button class="slot-btn slot-closed border rounded-lg py-1.5 text-sm font-bold" data-r="${r}" data-c="${c}" onclick="toggleSlot(this)">休假</button>`;
          } else if (cellVal === false || cellVal === "") {
            rowHTML += `<button class="slot-btn slot-open border rounded-lg py-1.5 text-sm font-bold" data-r="${r}" data-c="${c}" onclick="toggleSlot(this)">開放</button>`;
          } else {
            rowHTML += `<button class="slot-btn slot-event border rounded-lg py-1.5 text-xs font-bold truncate px-1 shadow-inner" disabled title="${cellVal}">${cellVal}</button>`;
          }
        });
        rowHTML += `</div>`;
        container.insertAdjacentHTML('beforeend', rowHTML);
      }
    }

    function changeWeek(dir) {
      currentWkIndex += dir;
      if (currentWkIndex < 0) currentWkIndex = 0;
      if (currentWkIndex >= weekCols.length) currentWkIndex = weekCols.length - 1;
      renderScheduleView();
    }

    function toggleSlot(btn) {
      if (btn.classList.contains('slot-open')) {
        btn.classList.replace('slot-open', 'slot-closed');
        btn.innerText = "休假";
        btn.dataset.val = "true";
      } else {
        btn.classList.replace('slot-closed', 'slot-open');
        btn.innerText = "開放";
        btn.dataset.val = "false";
      }
    }

    // ----------------------------------------------------
    // API 儲存邏輯 (現在必須帶著 validPassword 一起送出)
    // ----------------------------------------------------
    function saveAllSettings() {
      const saveBtn = document.getElementById('save-settings-btn');
      saveBtn.innerHTML = `<span>⏳</span> 寫入中...`; saveBtn.disabled = true;

      const checkedDays = Array.from(document.querySelectorAll('#weekdays-container input[type="checkbox"]:checked')).map(cb => cb.value);
      const configData = {
        tag: document.getElementById('conf-tag').value,
        title: document.getElementById('conf-title').value,
        desc: document.getElementById('conf-desc').value,
        line_url: document.getElementById('conf-line').value,
        open_time: document.getElementById('conf-open').value,
        close_time: document.getElementById('conf-close').value,
        interval: document.getElementById('conf-interval').value,
        advance_days: document.getElementById('conf-advance').value,
        closed_weekdays: checkedDays.join(', ')
      };

      const servicesData = Array.from(document.querySelectorAll('.service-card')).map(card => {
        const inputs = card.querySelectorAll('input');
        return { category: inputs[0].value, name: inputs[1].value, duration: inputs[2].value, price: inputs[3].value };
      });

      fetch(API_URL, { 
        method: 'POST', 
        body: JSON.stringify({ 
          action: "update_settings", 
          password: validPassword, // 🔑 帶上密碼
          config: configData, 
          services: servicesData 
        }) 
      })
      .then(res => res.json())
      .then(data => {
        alert(data.status === 'success' ? "✅ 設定與服務清單已更新！\n(如果更改了營業時間，排班表已在背景重繪，請重整畫面查看)" : "❌ 失敗：" + data.message);
      })
      .finally(() => { saveBtn.innerHTML = `<span>💾</span> 儲存設定與服務清單`; saveBtn.disabled = false; });
    }

    function saveSchedule() {
      const saveBtn = document.getElementById('save-schedule-btn');
      saveBtn.innerHTML = `<span>⏳</span> 儲存中...`; saveBtn.disabled = true;

      const updates = [];
      document.querySelectorAll('.slot-btn').forEach(btn => {
        if (btn.dataset.val) {
          updates.push({ r: parseInt(btn.dataset.r), c: parseInt(btn.dataset.c), val: btn.dataset.val === "true" });
        }
      });

      if (updates.length === 0) {
        alert("沒有任何修改！");
        saveBtn.innerHTML = `<span>💾</span> 儲存最新排班`; saveBtn.disabled = false;
        return;
      }

      fetch(API_URL, { 
        method: 'POST', 
        body: JSON.stringify({ 
          action: "update_schedule", 
          password: validPassword, // 🔑 帶上密碼
          updates: updates 
        }) 
      })
      .then(res => res.json())
      .then(data => {
        alert(data.status === 'success' ? "✅ 排班狀態已同步至試算表！" : "❌ 失敗：" + data.message);
        document.querySelectorAll('.slot-btn').forEach(btn => delete btn.dataset.val);
      })
      .finally(() => { saveBtn.innerHTML = `<span>💾</span> 儲存最新排班`; saveBtn.disabled = false; });
    }
  </script>
</body>
</html>
