<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>發送約展成功卡片</title>
  <!-- 載入 LINE 官方 SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .panel-card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      padding: 24px 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    .header-title {
      text-align: center;
      color: #00C800;
      font-size: 20px;
      font-weight: bold;
      margin-top: 0;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 14px;
      color: #333333;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #dcdfe6;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      background: #ffffff;
    }
    input:focus {
      border-color: #00C800;
    }
    .preview-box {
      background-color: #f8f9fa;
      border: 1px dashed #dcdfe6;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      color: #555;
      margin-top: 6px;
    }
    .send-btn {
      width: 100%;
      background-color: #00C800;
      color: #ffffff;
      border: none;
      padding: 14px;
      font-size: 17px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 8px rgba(0,200,0,0.25);
      transition: background-color 0.2s;
    }
    .send-btn:disabled {
      background-color: #a0aec0;
      cursor: not-allowed;
      box-shadow: none;
    }
    .send-btn:active:not(:disabled) {
      transform: scale(0.98);
    }
    .tips {
      margin-top: 15px;
      font-size: 12px;
      color: #888888;
      text-align: center;
      line-height: 1.5;
    }
    #statusMsg {
      display: none;
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      text-align: center;
    }
    .status-error {
      background-color: #fff2f0;
      color: #ff4d4f;
      border: 1px solid #ffccc7;
    }
    .status-warning {
      background-color: #fffbe6;
      color: #faad14;
      border: 1px solid #ffe58f;
    }
  </style>
</head>
<body>

<div class="panel-card">
  <div class="header-title">🗓️ 線上展示預約卡片發送器</div>

  <div class="form-group">
    <label for="meetTimePicker">📅 選擇展示日期與時間：</label>
    <input type="datetime-local" id="meetTimePicker" onchange="updateFormattedTime()">
    <div class="preview-box" id="timePreview">卡片顯示格式：請選擇時間</div>
  </div>

  <div class="form-group">
    <label for="salesName">👤 業務/顧問名稱：</label>
    <input type="text" id="salesName" value="暐庭">
  </div>

  <button class="send-btn" id="sendBtn" onclick="sendAppointmentCard()">發送約展卡片至群組/好友</button>

  <div id="statusMsg"></div>

  <div class="tips">
    💡 點擊發送後勾選對象即可傳送。
  </div>
</div>

<script>
  const MY_LIFF_ID = "2005817629-5OfjSdY5";
  let isLiffReady = false;
  let formattedTimeText = "";

  function setDefaultDateTime() {
    const now = new Date();
    now.setHours(now.getHours() + 1, 0, 0, 0);
    const localIso = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
    const picker = document.getElementById('meetTimePicker');
    picker.value = localIso;
    updateFormattedTime();
  }

  function updateFormattedTime() {
    const val = document.getElementById('meetTimePicker').value;
    if (!val) {
      formattedTimeText = "";
      document.getElementById('timePreview').innerText = "卡片顯示格式：請選擇時間";
      return;
    }
    const d = new Date(val);
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const date = String(d.getDate()).padStart(2, '0');
    const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
    const dayName = weekDays[d.getDay()];
    const hours = String(d.getHours()).padStart(2, '0');
    const minutes = String(d.getMinutes()).padStart(2, '0');

    formattedTimeText = `${year}/${month}/${date} (${dayName}) ${hours}:${minutes}`;
    document.getElementById('timePreview').innerText = `卡片顯示格式：${formattedTimeText}`;
  }

  function showMessage(text, type) {
    const el = document.getElementById('statusMsg');
    el.className = type === 'error' ? 'status-error' : 'status-warning';
    el.innerText = text;
    el.style.display = 'block';
  }

  function hideMessage() {
    document.getElementById('statusMsg').style.display = 'none';
  }

  async function initLiff() {
    try {
      await liff.init({ liffId: MY_LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }
      isLiffReady = true;
    } catch (err) {
      showMessage("LIFF 初始化異常：" + err.message, "error");
    }
  }

  async function sendAppointmentCard() {
    hideMessage();
    const btn = document.getElementById('sendBtn');
    const salesVal = document.getElementById('salesName').value.trim();

    if (!formattedTimeText) {
      showMessage("請選擇【預約展示時間】再進行發送！", "error");
      return;
    }
    if (!salesVal) {
      showMessage("請填寫【業務名稱】再進行發送！", "error");
      document.getElementById('salesName').focus();
      return;
    }

    if (!isLiffReady) {
      showMessage("系統連線中，請稍候 2 秒再試一次。", "warning");
      return;
    }

    if (!liff.isApiAvailable('shareTargetPicker')) {
      showMessage("目前環境不支援發送功能，請確認是在 LINE App 內開啟此連結。", "error");
      return;
    }

    btn.disabled = true;
    btn.innerText = "正在開啟發送視窗...";

    const cardJSON = {
      "type": "bubble",
      "header": {
        "type": "box",
        "layout": "vertical",
        "backgroundColor": "#00C800",
        "paddingAll": "16px",
        "contents": [
          {
            "type": "text",
            "text": "🗓️ 線上展示預約成功",
            "color": "#FFFFFF",
            "weight": "bold",
            "size": "lg",
            "align": "center"
          }
        ]
      },
      "body": {
        "type": "box",
        "layout": "vertical",
        "spacing": "md",
        "paddingAll": "18px",
        "contents": [
          {
            "type": "text",
            "text": "親愛的老闆您好，已為您安排線上展示",
            "wrap": true,
            "size": "sm",
            "color": "#333333"
          },
          {
            "type": "box",
            "layout": "vertical",
            "backgroundColor": "#F7F8FA",
            "cornerRadius": "md",
            "paddingAll": "12px",
            "spacing": "sm",
            "contents": [
              {
                "type": "box",
                "layout": "horizontal",
                "contents": [
                  { "type": "text", "text": "📅 時間", "size": "sm", "color": "#666666", "flex": 2 },
                  { "type": "text", "text": formattedTimeText, "size": "sm", "weight": "bold", "color": "#111111", "flex": 5, "wrap": true }
                ]
              },
              {
                "type": "box",
                "layout": "horizontal",
                "contents": [
                  { "type": "text", "text": "👤 業務", "size": "sm", "color": "#666666", "flex": 2 },
                  { "type": "text", "text": salesVal, "size": "sm", "weight": "bold", "color": "#111111", "flex": 5 }
                ]
              }
            ]
          },
          {
            "type": "text",
            "text": "💻 建議設備：\n建議使用電腦或平板參與，畫面較大且字體清晰，能獲得最佳展示體驗唷！業務將於展示前 5 分鐘發送連結，請留意群組。",
            "wrap": true,
            "size": "xs",
            "color": "#444444"
          },
          {
            "type": "text",
            "text": "💡 重要提醒：\n若您預計使用手機參與，請先下載 Google Meet App，以確保連結能順利開啟唷！（下方按鈕點擊可直接下載唷）",
            "wrap": true,
            "size": "xs",
            "color": "#444444"
          },
          {
            "type": "text",
            "text": "⬇️下方按鈕點擊可直接下載唷⬇️",
            "wrap": true,
            "size": "xs",
            "color": "#444444"
          },
          {
            "type": "box",
            "layout": "horizontal",
            "spacing": "md",
            "margin": "md",
            "contents": [
              {
                "type": "box",
                "layout": "vertical",
                "flex": 1,
                "contents": [
                  {
                    "type": "button",
                    "action": {
                      "type": "uri",
                      "label": "iOS 下載",
                      "uri": "https://apps.apple.com/tw/app/google-meet/id1096918571"
                    },
                    "style": "secondary",
                    "height": "sm"
                  }
                ]
              },
              {
                "type": "box",
                "layout": "vertical",
                "flex": 1,
                "contents": [
                  {
                    "type": "button",
                    "action": {
                      "type": "uri",
                      "label": "安卓下載",
                      "uri": "https://play.google.com/store/apps/details?id=com.google.android.apps.tachyon"
                    },
                    "style": "secondary",
                    "height": "sm"
                  }
                ]
              }
            ]
          },
          {
            "type": "separator",
            "margin": "lg"
          },
          {
            "type": "text",
            "text": "ezPretty 預約科技",
            "align": "center",
            "size": "xs",
            "color": "#AAAAAA",
            "margin": "md"
          }
        ]
      }
    };

    try {
      const res = await liff.shareTargetPicker([
        {
          "type": "flex",
          "altText": "🗓️ 線上展示預約成功通知",
          "contents": cardJSON
        }
      ]);

      if (res) {
        liff.closeWindow();
      } else {
        btn.disabled = false;
        btn.innerText = "發送約展卡片至群組/好友";
        showMessage("已取消發送。", "warning");
      }
    } catch (err) {
      btn.disabled = false;
      btn.innerText = "發送約展卡片至群組/好友";
      showMessage("發送失敗：" + (err.message || JSON.stringify(err)), "error");
    }
  }

  setDefaultDateTime();
  initLiff();
</script>

</body>
</html>
