<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>線上預約展示</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-light: #eef2ff;
      --accent: #06c755;
      --accent-hover: #05b04b;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px 12px; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; }
    
    .app-card { width: 100%; max-width: 480px; background: var(--card); border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.04); padding: 24px 20px; position: relative; min-height: 520px; }
    
    .shop-header { text-align: center; margin-bottom: 20px; }
    .shop-tag { display: inline-block; background: var(--primary-light); color: var(--primary); font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; margin-bottom: 8px; }
    .shop-title { font-size: 1.3rem; font-weight: 800; color: var(--text); }
    .shop-desc { font-size: 0.85rem; color: var(--muted); margin-top: 6px; line-height: 1.5; }
    
    .section-label { font-size: 0.9rem; font-weight: 700; margin: 18px 0 10px; display: flex; align-items: center; gap: 6px; }
    .step-badge { width: 18px; height: 18px; border-radius: 50%; background: var(--primary); color: #fff; font-size: 0.7rem; display: inline-flex; align-items: center; justify-content: center; }
    
    .services-grid { display: flex; flex-direction: column; gap: 8px; }
    .service-item { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.15s; }
    .service-item:hover { border-color: var(--primary); }
    .service-item.active { border-color: var(--primary); background: var(--primary-light); }
    .service-name { font-weight: 600; font-size: 0.9rem; }
    .service-meta { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
    
    .date-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 4px; }
    .date-btn { text-align: center; border: 1px solid var(--border); border-radius: 10px; padding: 10px 0; cursor: pointer; background: #fff; transition: 0.15s; }
    .date-btn.active { border-color: var(--primary); background: var(--primary); color: #fff; }
    .date-btn.active .d-w, .date-btn.active .d-n { color: #fff; }
    .d-w { font-size: 0.72rem; color: var(--muted); }
    .d-n { font-size: 1rem; font-weight: 700; margin-top: 2px; }
    
    .time-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .time-btn { border: 1px solid var(--border); border-radius: 8px; padding: 8px 0; font-size: 0.85rem; font-weight: 600; text-align: center; cursor: pointer; background: #fff; transition: 0.15s; }
    .time-btn:hover { border-color: var(--primary); color: var(--primary); }
    .time-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .time-btn.disabled { background: #f1f5f9; color: #cbd5e1; border-color: #f1f5f9; cursor: not-allowed; text-decoration: line-through; }
    
    /* 讓尚未同步完成的時段呈現半透明，暗示正在載入 */
    .time-btn.syncing { opacity: 0.5; pointer-events: none; }
    
    .input-row { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
    .input-field { padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; outline: none; }
    .input-field:focus { border-color: var(--primary); }
    
    .address-wrapper { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-in-out, margin-top 0.3s ease-in-out; }
    .address-wrapper.show { max-height: 100px; margin-top: 10px; }

    .submit-btn { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 14px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 22px; display: flex; justify-content: center; align-items: center; gap: 6px; transition: 0.2s; }
    .submit-btn:disabled { background: #cbd5e1; cursor: not-allowed; }
    .submit-btn:hover:not(:disabled) { background: var(--accent-hover); }
    
    .hint-text { text-align: center; font-size: 0.78rem; color: var(--muted); margin-top: 10px; }

    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(4px);
      z-index: 999; justify-content: center; align-items: center; padding: 20px;
    }
    .modal-box {
      background: #fff; border-radius: 20px; max-width: 380px; width: 100%;
      padding: 28px 20px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
      animation: popIn 0.25s ease-out forwards;
    }
    @keyframes popIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-icon { width: 64px; height: 64px; background: #dcfce7; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 2rem; margin-bottom: 16px; }
    .modal-title { font-size: 1.25rem; font-weight: 800; color: var(--text); margin-bottom: 8px; }
    .modal-step-box { background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 12px; padding: 14px; margin: 16px 0; text-align: left; font-size: 0.88rem; color: #334155; line-height: 1.6; }
    .step-highlight { color: #059669; font-weight: 700; }
  </style>
</head>
<body>

<div class="app-card">

  <div class="shop-header">
    <div class="shop-tag" id="shopTag">線上預約</div>
    <h1 class="shop-title" id="shopTitle">系統功能展示與流程介紹</h1>
    <p class="shop-desc" id="shopDesc">Google Meet 線上操作 · 免開鏡頭 · 約30分鐘</p>
  </div>

  <div class="section-label"><span class="step-badge">1</span> 選擇預約項目</div>
  <div class="services-grid" id="servicesList"></div>

  <div class="section-label"><span class="step-badge">2</span> 選擇預約日期</div>
  <div class="date-grid" id="dateList"></div>

  <!-- 時段標題加入同步狀態提示 -->
  <div class="section-label">
    <span class="step-badge">3</span> 選擇時段 
    <span id="syncStatus" style="font-size:0.75rem; color:#f59e0b; margin-left:8px; font-weight:normal;">(同步即時空檔中...)</span>
  </div>
  <div class="time-grid" id="timeList"></div>

  <div class="section-label"><span class="step-badge">4</span> 聯絡資訊</div>
  <div class="input-row">
    <input type="text" class="input-field" id="custName" placeholder="店家名稱 / 您的稱呼 *" oninput="checkValid()">
    <input type="tel" class="input-field" id="custPhone" placeholder="聯絡電話 *" oninput="checkValid()">
    
    <div class="address-wrapper" id="addressWrapper">
      <input type="text" class="input-field" style="width: 100%;" id="custAddress" placeholder="請輸入店家地址 / 拜訪地點 *" oninput="checkValid()">
    </div>
  </div>

  <button class="submit-btn" id="submitBtn" onclick="prepareBooking()" disabled>
    <span>傳送預約至 LINE 進行確認</span>
  </button>
  <div class="hint-text">點擊後將自動寫入排程並開啟 LINE</div>
</div>

<!-- 防呆引導彈窗 -->
<div class="modal-overlay" id="guideModal">
  <div class="modal-box">
    <div class="modal-icon">📋</div>
    <div class="modal-title">預約資訊已初步登記！</div>
    
    <div class="modal-step-box">
      <b>預約文字已自動複製：</b><br>
      請點擊下方按鈕前往 LINE，在輸入框 <span class="step-highlight">【長按貼上並送出】</span> 即可快速通知！
      
      <div style="margin-top: 12px; padding-top: 12px; border-top: 1px dashed #cbd5e1; font-size: 0.8rem; color: #64748b;">
        💡 忘記貼上傳送也沒關係，暐庭後台已經有紀錄囉！稍晚忙完會主動與您確認預約。
      </div>
    </div>

    <button class="submit-btn" onclick="goToLine()" style="margin-top: 10px;">
      <span>前往 LINE 貼上送出 ➔</span>
    </button>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbwUs-vR35AnP5iHJx-Eiwf-b8qnkOTdvzrd4pN0SdFnJcIDS0X6LboqdMd9I1-n--4G/exec";

  const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
  let dynamicHours = []; 
  let currentConfig = { line_url: "https://line.me/ti/p/lcu67rCFAY" };
  let bookedMap = {};
  
  let selectedService = "";
  let isNeedAddress = false;
  let selectedDate = null;
  let selectedTime = null;
  let daysData = [];
  let preparedMessage = "";
  
  // 新增一個變數追蹤是否已經同步完日曆
  let isSynced = false;

  function formatLocalDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function generateTimeSlots(openTime, closeTime, intervalMinutes) {
    let slots = [];
    try {
      let openStr = (openTime || "10:00").toString().trim();
      let closeStr = (closeTime || "20:00").toString().trim();
      let intv = parseInt(intervalMinutes || "60", 10);

      if (!openStr.includes(':')) openStr = "10:00";
      if (!closeStr.includes(':')) closeStr = "20:00";

      let [openH, openM] = openStr.split(':').map(Number);
      let [closeH, closeM] = closeStr.split(':').map(Number);
      
      let current = new Date();
      current.setHours(openH, openM || 0, 0, 0);
      
      let end = new Date();
      end.setHours(closeH, closeM || 0, 0, 0);
      
      let limit = 0; 
      while (current <= end && limit < 50) {
        let h = String(current.getHours()).padStart(2, '0');
        let m = String(current.getMinutes()).padStart(2, '0');
        slots.push(`${h}:${m}`);
        current.setMinutes(current.getMinutes() + intv);
        limit++;
      }
    } catch (e) {
      slots = ["10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00", "20:00"];
    }
    return slots;
  }

  window.onload = function() {
    // 1. 網頁一打開，立刻用預設資料把畫面畫出來，0秒等待！
    initDates();
    renderDefaultServices();

    // 2. 在背景默默去抓 Google Sheet 跟 日曆資料
    fetch(API_URL)
      .then(res => res.json())
      .then(data => {
        if (data.status === 'success') {
          isSynced = true; // 標記已同步完成
          currentConfig = data.config;
          bookedMap = data.booked;
          
          if (currentConfig.tag) document.getElementById('shopTag').innerText = currentConfig.tag;
          if (currentConfig.title) document.getElementById('shopTitle').innerText = currentConfig.title;
          if (currentConfig.desc) document.getElementById('shopDesc').innerText = currentConfig.desc;
          
          let openT = currentConfig.open_time || "10:00";
          let closeT = currentConfig.close_time || "20:00";
          let intv = currentConfig.interval || "60";
          dynamicHours = generateTimeSlots(openT, closeT, intv);

          // 重新渲染服務與時段（把真正被約走的時間打叉）
          renderServices(currentConfig.services || []);
          renderTimes();
          
          // 隱藏同步提示文字
          document.getElementById('syncStatus').style.display = 'none';
        }
      })
      .catch(err => {
        console.error("載入試算表失敗，維持預設狀態", err);
        isSynced = true;
        renderTimes();
        document.getElementById('syncStatus').innerText = "(無法取得最新空檔)";
        document.getElementById('syncStatus').style.color = "#ef4444";
      });
  };

  function renderDefaultServices() {
    dynamicHours = generateTimeSlots("10:00", "20:00", "60");
    renderServices([
      { name: "30分鐘 系統功能線上展示 (免開鏡頭)", duration: "30 min", price: "免費" },
      { name: "1對1 店家營運現場展示", duration: "60 min", price: "免費" }
    ]);
    renderTimes(); // 畫出預設時段
  }

  function renderServices(services) {
    const box = document.getElementById('servicesList');
    box.innerHTML = '';
    services.forEach((s, idx) => {
      const item = document.createElement('div');
      item.className = `service-item ${idx === 0 ? 'active' : ''}`;
      if (idx === 0) {
        selectedService = s.name;
        isNeedAddress = selectedService.includes('現場');
      }

      item.innerHTML = `
        <div>
          <div class="service-name">${s.name}</div>
          <div class="service-meta">會議時間：${s.duration}</div>
        </div>
        <div style="font-weight: 700; color: var(--primary); font-size: 0.9rem;">${s.price}</div>
      `;
      
      item.onclick = () => {
        document.querySelectorAll('.service-item').forEach(el => el.classList.remove('active'));
        item.classList.add('active');
        selectedService = s.name;
        
        isNeedAddress = selectedService.includes('現場');
        const addrWrap = document.getElementById('addressWrapper');
        if (isNeedAddress) {
          addrWrap.classList.add('show');
        } else {
          addrWrap.classList.remove('show');
          document.getElementById('custAddress').value = ""; 
        }
        checkValid();
      };
      box.appendChild(item);
    });
    
    if (isNeedAddress) {
      document.getElementById('addressWrapper').classList.add('show');
    }
  }

  function initDates() {
    daysData = [];
    const now = new Date();

    for (let i = 0; i < 7; i++) {
      const d = new Date();
      d.setDate(now.getDate() + i);
      const iso = formatLocalDate(d);
      const m = d.getMonth() + 1;
      const date = d.getDate();
      const w = weekdays[d.getDay()];
      const wLabel = (i === 0) ? '今天' : `週${w}`;

      daysData.push({ iso, label: `${m}/${date}`, w: wLabel, isToday: (i === 0) });
    }
    selectedDate = daysData[0].iso;

    const box = document.getElementById('dateList');
    box.innerHTML = '';
    daysData.forEach((d, idx) => {
      const btn = document.createElement('div');
      btn.className = `date-btn ${idx === 0 ? 'active' : ''}`;
      btn.innerHTML = `<div class="d-w">${d.w}</div><div class="d-n">${d.label}</div>`;
      btn.onclick = () => {
        document.querySelectorAll('.date-btn').forEach(el => el.classList.remove('active'));
        btn.classList.add('active');
        selectedDate = d.iso;
        selectedTime = null;
        renderTimes();
        checkValid();
      };
      box.appendChild(btn);
    });
  }

  function renderTimes() {
    const box = document.getElementById('timeList');
    box.innerHTML = '';
    const bookedForDay = bookedMap[selectedDate] || [];
    const isAllDayBlocked = bookedForDay.includes("全天不開放");

    const now = new Date();
    const todayStr = formatLocalDate(now);
    const currentH = now.getHours();
    const currentM = now.getMinutes();

    dynamicHours.forEach(t => {
      const [slotH, slotM] = t.split(':').map(Number);
      
      const isPastTime = (selectedDate === todayStr) && 
                         (slotH < currentH || (slotH === currentH && slotM <= currentM));
                         
      const isBooked = isAllDayBlocked || bookedForDay.includes(t) || isPastTime;

      const btn = document.createElement('div');
      // 如果還沒同步完成，給一個半透明的效果讓客人知道還不能點
      const syncClass = isSynced ? '' : 'syncing'; 
      btn.className = `time-btn ${isBooked ? 'disabled' : ''} ${t === selectedTime ? 'active' : ''} ${syncClass}`;
      btn.innerText = t;
      
      if (!isBooked && isSynced) {
        btn.onclick = () => {
          document.querySelectorAll('.time-btn').forEach(el => el.classList.remove('active'));
          btn.classList.add('active');
          selectedTime = t;
          checkValid();
        };
      }
      box.appendChild(btn);
    });
  }

  function checkValid() {
    // 必須確認日曆已經同步完成才能送出
    if (!isSynced) return; 
    
    const name = document.getElementById('custName').value.trim();
    const phone = document.getElementById('custPhone').value.trim();
    const address = document.getElementById('custAddress').value.trim();
    const btn = document.getElementById('submitBtn');
    
    let isValid = (selectedService && selectedDate && selectedTime && name && phone);
    if (isNeedAddress && !address) isValid = false;
    btn.disabled = !isValid;
  }

  // 【新增】老舊手機與 LINE 內部瀏覽器的專用複製備案
  function fallbackCopyTextToClipboard(text) {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    // 避免畫面亂跳，固定在角落
    textArea.style.top = "0";
    textArea.style.left = "0";
    textArea.style.position = "fixed";
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    try {
      document.execCommand('copy');
    } catch (err) {
      console.error('Fallback 複製失敗', err);
    }
    document.body.removeChild(textArea);
  }

  // 送出預約：寫入 Google Sheet + Google 日曆 + 彈窗引導
  function prepareBooking() {
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = "排程登記中...";

    const name = document.getElementById('custName').value.trim();
    const phone = document.getElementById('custPhone').value.trim();
    const address = document.getElementById('custAddress').value.trim();
    const dayObj = daysData.find(d => d.iso === selectedDate);

    const methodText = isNeedAddress 
                       ? `📍 拜訪地點：${address}` 
                       : `📹 會議方式：Google Meet (免開鏡頭)`;

    preparedMessage = `您好，我已透過線上表單登記預約：\n\n` +
                      `👤 店家稱呼：${name}\n` +
                      `📱 聯絡電話：${phone}\n` +
                      `💻 預約項目：${selectedService}\n` +
                      `🗓 預約時間：${dayObj.label} (${dayObj.w}) ${selectedTime}\n` +
                      `${methodText}\n\n` +
                      `再麻煩您確認預約，謝謝！`;

    // 【關鍵修正 1】按下按鈕的第一時間，立刻執行複製動作！破解舊版 iOS 限制
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(preparedMessage).catch(() => {
        fallbackCopyTextToClipboard(preparedMessage);
      });
    } else {
      fallbackCopyTextToClipboard(preparedMessage);
    }

    // 【關鍵修正 2】複製完畢後，再發送 API 給 GAS 背景處理
    const payload = {
      custName: name,
      custPhone: phone,
      serviceName: selectedService,
      dateIso: selectedDate,
      timeStr: selectedTime,
      address: address
    };

    fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(res => {
      // 成功後顯示彈窗
      document.getElementById('guideModal').style.display = 'flex';
      btn.innerText = "傳送預約至 LINE 進行確認";
    })
    .catch(err => {
      console.error("同步至後台失敗", err);
      // 就算網路斷線，也讓客人可以傳 LINE
      document.getElementById('guideModal').style.display = 'flex';
      btn.innerText = "傳送預約至 LINE 進行確認";
    });
  }

  function goToLine() {
    window.location.href = currentConfig.line_url || "https://line.me/ti/p/lcu67rCFAY";
  }
</script>
</body>
</html>
